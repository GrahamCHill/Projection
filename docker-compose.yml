services:
  backend:
    build:
      context: ./py_backend_logic
      dockerfile: Dockerfile
    container_name: projection_backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-projection}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-projection-documents}
      - USE_MOCK_S3=${USE_MOCK_S3:-true}
      - VECTOR_DB_URL=${VECTOR_DB_URL:-http://qdrant:6333}
      - GO_BACKEND_URL=${GO_BACKEND_URL:-http://go_backend:8001}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-for-jwt}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CONSOLE_LOG_LEVEL=${CONSOLE_LOG_LEVEL:-INFO}
      - FILE_LOG_LEVEL=${FILE_LOG_LEVEL:-DEBUG}
      - LOG_DIR=${LOG_DIR:-logs}
      - MAX_LOG_SIZE_MB=${MAX_LOG_SIZE_MB:-10}
      - LOG_BACKUP_COUNT=${LOG_BACKUP_COUNT:-5}
      # Metrics Configuration
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_RETENTION_MINUTES=${METRICS_RETENTION_MINUTES:-60}
      - METRICS_SNAPSHOT_INTERVAL_SECONDS=${METRICS_SNAPSHOT_INTERVAL_SECONDS:-60}
      - METRICS_DIR=${METRICS_DIR:-metrics}
      # Plugin Configuration
      - PLUGINS_ENABLED=${PLUGINS_ENABLED:-true}
      - PLUGINS_DIR=${PLUGINS_DIR:-plugins}
      - PLUGIN_CONFIG_FILE=${PLUGIN_CONFIG_FILE:-plugin_config.json}
    volumes:
      - ./py_backend_logic:/app
      - ./logs:/app/logs
      - ./metrics:/app/metrics
      - ./plugins:/app/plugins
    restart: unless-stopped
    networks:
      - projection_network
    depends_on:
      - postgres
      - minio
      - qdrant
      - go_backend
      - redis
    
  go_backend:
    build:
      context: ./go_backend
      dockerfile: Dockerfile
      args:
        # Can be overridden with GOARCH environment variable
        # Docker Compose doesn't support shell commands directly, so we use environment variables
        GOARCH: ${GOARCH}
    container_name: projection_go_backend
    ports:
      - "8001:8001"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    # Removed volume mount that was overwriting the built binary
    # volumes:
    #   - ./go_backend:/app
    restart: unless-stopped
    networks:
      - projection_network


  frontend:
    build:
      context: ./react_frontend
      dockerfile: Dockerfile
    container_name: projection_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - projection_network

  # PostgreSQL service
  postgres:
    image: postgres:15
    container_name: projection_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_DB=${DB_NAME:-projection}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - projection_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO service (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: projection_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - projection_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: projection_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - projection_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      
  # Redis cache for user-role combinations
  redis:
    image: redis:alpine
    container_name: projection_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - projection_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  projection_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  redis_data: