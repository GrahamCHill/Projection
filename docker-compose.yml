version: '3.8'

services:
  backend:
    build:
      context: ./py_backend_logic
      dockerfile: Dockerfile
    container_name: cv_scanner_backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - SQLITE_PATH=${SQLITE_PATH:-sqlite:///./cv_scanner.db}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-cv_scanner}
    volumes:
      - ./py_backend_logic:/app
    restart: unless-stopped
    networks:
      - cv_scanner_network
    depends_on:
      - mysql
    # Only when using MySQL
    # Comment out the depends_on if using SQLite

  frontend:
    build:
      context: ./react_frontend
      dockerfile: Dockerfile
    container_name: cv_scanner_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cv_scanner_network

  # MySQL service (only used when DB_TYPE=mysql)
  mysql:
    image: mysql:8.0
    container_name: cv_scanner_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_DATABASE=${DB_NAME:-cv_scanner}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cv_scanner_network
    # To disable MySQL when using SQLite, you can comment out this service
    # or set the profile to "mysql" and only enable it when needed

networks:
  cv_scanner_network:
    driver: bridge

volumes:
  mysql_data: